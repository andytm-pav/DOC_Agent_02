doc_type_patterns:
  ks2: ["\\bКС-?2\\b", "Акт о приёмке выполненных работ", "Акт о приемке выполненных работ"]
  ks3: ["\\bКС-?3\\b", "Справка о стоимости"]
  ks6: ["\\bКС-?6\\b", "Журнал учёта выполненных работ"]
  ttn: ["\\bТТН\\b", "Товарно-транспортная накладная"]
  ds:  ["Дополнительное соглашение", "\\bДС\\s*№"]
  id:  ["Исполнительная документация", "\\bИД\\b"]
  invoice: ["Счёт-фактура", "Счет-фактура", "\\bУПД\\b"]

description_only:
  - "извещени*"
  - "квитанц*"
  - "чек*"
  - "уведомлени*"

city_extract:
  method: "regex+dict"
  dict_file: "config/cities.txt"

contract_patterns:
  - "(?:Договор|Контракт)\\s*№?\\s*([\\w\\-/]+)"
  - "\\bД-?(\\d+[\\w\\-/]*)"

doc_number_patterns:
  - "(?:№|N)\\s*(\\d+[\\w\\-/]*)"

amount_patterns:
  - "(?:Итого|Всего|Сумма|Всего к оплате|ВСЕГО)\\s*(?:с\\s*НДС)?[^\\d]{0,40}(\\d[\\d\\s]{2,}(?:[.,]\\d{1,2})?)"
  - "(\\d[\\d\\s]{2,}(?:[.,]\\d{2})?)\\s*(?:руб|₽|RUB)"

date_patterns:
  - "(\\d{2})[.](\\d{2})[.](\\d{4})"
