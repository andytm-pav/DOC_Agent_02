# ======================================================================
# ЕДИНЫЙ КОНФИГ агента «Документовед».
# Всё, что настраивается, — здесь. Код значения не хардкодит.
# Поддерживается подстановка переменных окружения: "${VAR}" (из .env).
# ======================================================================

app:
  host: 0.0.0.0
  port: 8000
  secret_key: "${SECRET_KEY}"
  data_dir: "./data"
  # Администратор по умолчанию (создаётся при первом старте БД)
  admin_username: "${ADMIN_USERNAME}"
  admin_password: "${ADMIN_PASSWORD}"
  # Куда класть загруженные файлы (подпапка внутри data_dir)
  storage_subdir: "storage"

storage:
  local_paths: ["./data/storage"]
  network_paths: []            # пример: ["smb://user:pass@server/share"]

# ----------------------------------------------------------------------
# ИМПОРТ СВАЛКИ ФАЙЛОВ ИЗ ПАПКИ:
#   - в чате есть кнопка «Импортировать папку» — путь можно указать там;
#   - пути, заданные здесь, автоматически подставляются в поле UI.
#   Плюс по-прежнему можно перетаскивать файлы по одному (drag&drop).
# ----------------------------------------------------------------------
ingest:
  folder_paths: []             # пример: ["D:/Свалка_документов", "C:/Docs/входящие"]
  recursive: true              # обходить вложенные подпапки
  max_files_per_scan: 0        # максимум документов за один импорт; 0 = БЕЗ ЛИМИТА
  # Глушить UserWarning библиотек-экстракторов (openpyxl: «Print area cannot
  # be set…», «Workbook contains no default style…») — шум в консоли/логах.
  suppress_extract_warnings: true
  # Что импортировать из папки (по расширению). Остальное пропускается
  # со счётчиком «не поддерживаются». Расширение — без точки.
  supported_extensions: [pdf, docx, xlsx, xlsm, pptx, csv, txt, log, md,
                         eml, msg, xml, gge, amkr, arps, zip,
                         png, jpg, jpeg, gif, bmp, tif, tiff, 7z, rar]

# ----------------------------------------------------------------------
# РАЗГРЕБАНИЕ СВАЛКИ ПО ПАПКАМ:
#   агент сам создаёт папку по указанному пути и раскладывает файлы из
#   свалки по тематическим подпапкам — названия придумывает по содержимому
#   (LLM из секции llm; без LLM — fallback: by_extension | single).
#   По умолчанию файлы КОПИРУЮТСЯ, свалка не меняется.
# ----------------------------------------------------------------------
sorting:
  enabled: true
  default_output_suffix: "_разобрано"      # если «куда» не указано: <свалка><суффикс>
  run_dir_prefix: "Разобранная свалка"     # имя создаваемой папки + дата-время
  run_dir_time_format: "%Y-%m-%d_%H-%M-%S"
  recursive: true                          # обходить вложенные подпапки свалки
  max_files: 0                             # максимум файлов за один запуск; 0 = БЕЗ ЛИМИТА
  text_excerpt_chars: 1200                 # сколько символов текста читать из файла для темы
  batch_size: 20                           # файлов в одном запросе к LLM
  batch_max_chars: 12000                   # макс. объём символов в одном запросе к LLM
  max_folders: 20                          # максимум тематических папок (лишнее -> Прочее)
  max_folder_name_len: 60                  # макс. длина названия папки
  misc_folder: "Прочее"                    # куда попадает неопознанное/сверх лимита
  fallback: "by_extension"                 # без LLM: by_extension | single (всё в misc_folder)
  fallback_folder_template: "Файлы {ext}"  # имя папки при by_extension (ext = PDF, DOCX...)
  move_files: false                        # false = копировать; true = перемещать (свалка очистится)
  duplicate_name_template: "{stem} ({n}){suffix}"  # коллизии имён в одной папке
  llm_retries: 1                           # повторов на пакет при сбое LLM
  poll_interval_ms: 1000                   # как часто UI опрашивает статус разбора

# ----------------------------------------------------------------------
# ЧАТ: история, память (контекст) и строка статуса агента.
#   История сообщений хранится в БД и переживает обновление страницы —
#   видна, пока пользователь не нажмёт «Очистить историю».
#   «Очистить контекст» сворачивает активную часть беседы в сжатую памятку
#   (архив памяти): она НЕ занимает контекстное окно актуального контекста
#   и поднимается по запросу вида «вспомни …» (recall_keywords).
# ----------------------------------------------------------------------
chat:
  history_load_limit: 200        # сколько последних сообщений загружать при открытии страницы
  context_max_messages: 20       # сколько последних активных сообщений составляют актуальный контекст
  context_summary_chars: 4000    # макс. объём текста беседы, отправляемого LLM на суммаризацию
  archive_title_chars: 80        # макс. длина заголовка памятки в архиве
  archives_list_limit: 50        # сколько памятек показывать в панели «Архив памяти»
  recall_max_archives: 3         # сколько памятек поднимать в ответе на «вспомни …»
  recall_max_terms: 8            # максимум поисковых слов из вопроса для поиска по архиву
  recall_min_word_len: 4         # слова короче этого в поиск по архиву не попадают
  recall_keywords: ["вспомни", "вспомнить", "напомни", "прошлый раз",
                    "что было раньше", "мы загружали", "мы обсуждали", "в прошлый"]
  status_poll_ms: 2000           # период обновления строки статуса агента в UI
  health_cache_sec: 15           # кэш проверки БД/вектор/LLM для строки статуса
  debug_log_tail: 30             # сколько последних ошибок отдавать в админ-диагностике
  debug_audit_tail: 20           # сколько последних записей аудита отдавать в диагностике

# ----------------------------------------------------------------------
# LLM-ПЛАНИРОВЩИК ЧАТА (v2.6): вопрос пользователя на естественном языке
# сначала ПОНИМАЕТ LLM (с картотекой и контекстом беседы) и выбирает
# механизм — подсчёт/список/поиск по картотеке, чтение файла, поиск по
# содержимому (RAG), подсказка или прямой ответ. Жёстких привязок к фразам
# нет. Ключевые слова qa.* ниже — только офлайн-fallback (без LLM или при
# сбое планировщика). Ответ на механизмах тоже формулирует LLM
# (config/prompts/synthesis.txt, reporter.txt, deep_read.txt).
# Промпт планировщика — config/prompts/planner.txt.
# ----------------------------------------------------------------------
planner:
  enabled: true
  model: "light"               # light = llm.model_light, main = llm.model_main
  timeout_sec: 30
  retries: 1                   # повторов при сбое/не-JSON (reasoning-модели переживаются)
  max_terms: 8                 # максимум термов поиска от планировщика
  allowed_actions: [count_files, list_files, find_files, read_file,
                    search_content, help, direct]
  allow_direct_reply: true     # прямой ответ на приветствия/благодарности (без RAG)
  fallback_keywords: true      # сбой планировщика -> интенты по ключевым словам
  synthesize_lists: true       # списки/подсчёты картотеки — в ест. язык через LLM
  context_max_chars: 1200      # сколько контекста беседы отдать планировщику
  catalog_for_planner: true    # картотека в промпте планировщика (выбор файла)
  catalog_max_chars: 4000

# ----------------------------------------------------------------------
# ДЕТЕРМИНИРОВАННЫЕ МЕХАНИЗМЫ ЧАТА (офлайн-fallback и данные для
# планировщика): списки/подсчёты по картотеке БД, поиск по названиям
# и типам, подсказка вместо «НЕТ ДАННЫХ», лимиты списков.
# ----------------------------------------------------------------------
qa:
  list_files_keywords: ["покажи все файлы", "покажи файлы", "список файлов",
                        "какие файлы", "что за файлы", "какие документы",
                        "список документов", "что загружено", "все файлы",
                        "все документы"]
  help_keywords: ["что ты можешь", "что вы можете", "что умеешь",
                  "что вы умеете", "какие возможности", "как пользоваться",
                  "помощь", "help"]
  # Подсчёт: вопрос начинается/содержит «сколько» -> посчитаем файлы
  count_trigger_words: ["сколько"]
  # Слова файлового домена: без них «сколько стоит ремонт…» — вопрос
  # про содержимое, а не про файлы (не перехватываем подсчётом)
  file_domain_words: [файл, файла, файлы, файлов, документ, документа,
                      документы, документов, картотека, картотеке, типов,
                      обработано, обработал, загружено, загрузил]
  # Поиск по названиям/типам: триггер -> ищем совпавшие файлы; если 0 —
  # вопрос уходит в обычный поиск по содержимому (не отвечаем мимо)
  find_files_keywords: ["покажи все", "показать все", "найди", "найти",
                        "поищи", "есть ли файлы", "есть ли документы",
                        "открой файл"]
  # Русские подписи типов документов (для ответов и каталога)
  doc_type_labels:
    ks2: "КС-2"
    ks3: "КС-3"
    ks6: "КС-6"
    ttn: "ТТН"
    ds: "ДС"
    id: "ИД"
    invoice: "счёт"
    contract: "договор"
    other: "прочее"
  # Слова запроса, которые мапятся на тип документа при поиске
  # («договор» найдёт и файлы с «договор» в имени, и doc_type=contract)
  doc_type_aliases:
    ks2: [кс2, кс-2]
    ks3: [кс3, кс-3]
    ks6: [кс6, кс-6]
    ttn: [ттн, трн]
    ds: [дс]
    invoice: [счёт, счет, счета, счетов]
    contract: [договор, договора, договоров, подряд, подряда]
  list_limit: 30                # максимум файлов в одном ответе
  name_min_word_len: 4          # слова короче не ищутся в названиях файлов
  name_max_terms: 8             # максимум поисковых слов в названиях файлов
  # Токены НЕ длиннее этого (и токены с цифрами: «кс2», «23») ищутся
  # ТОЛЬКО точным вхождением — иначе «кс2»->«к» находило всё подряд,
  # а «23»->«2» находило «№27-07-2026» (баг v2.4.1)
  name_exact_max_len: 4
  name_stopwords: [файл, файла, файлы, файлов, документ, документы, документов,
                   покажи, показать, список, какие, какой, какая,
                   есть, были, загружено, загруженные, загрузил, загрузили,
                   все, всё, свой, моя, мне, меня, чтобы, которые,
                   сколько, штук, всего, обработал, обработано, обработать,
                   прочитай, прочитать, открой, найди, найти, поищи,
                   подробно, полностью, целиком, содержимое, скажи, дай]
  # Если по названиям 0 — посчитать по содержимому чанков?
  count_content_fallback: true
  count_content_scan_max_chunks: 50000   # верхняя граница скана (защита)
  # Картотека в промпте репортера: агент «знает», какие файлы есть
  catalog_max_files: 150        # максимум строк каталога в промпте
  catalog_max_chars: 12000      # макс. объём каталога в промпте (симв.)
  catalog_brief_chars: 140      # краткое описание файла (начало текста)
  # Вместо голого «НЕТ ДАННЫХ» — подсказка с похожими файлами
  no_data_suggest: true
  # Глубокое чтение: полные тексты файлов в промпт (не векторный поиск)
  deep_read_cues: ["прочитай", "прочитать", "открой файл", "что в файле",
                   "что в документе", "содержимое файла", "читай файл",
                   "полностью", "целиком", "подробно"]
  deep_read_max_files: 6        # максимум файлов за одно глубокое чтение (v2.6.1: было 3 — не хватало на группу смет одного объекта)
  deep_read_max_chars: 60000    # макс. суммарный объём текстов (симв.)
  # Сколько термов вопроса должны совпасть с названием/типом файла,
  # чтобы файл взяли для глубокого чтения/подсказки
  deep_read_min_terms: 2
  deep_read_on_no_data: true    # автодочтение после «НЕТ ДАННЫХ» поиска
  deep_read_confidence: 0.9
  # --- v2.8: ОТКАЗ КАК ПОЛНОЦЕННАЯ ФИЧА (анти-галлюцинация) ---
  # Если ретрив вернул только слабые сигналы (векторный косинус НИЖЕ
  # refuse_vector_below И лексическое перекрытие НИЖЕ refuse_lexical_below),
  # LLM не вызывается вовсе: детерминированный отказ «информации не найдено»
  # + подсказка похожих файлов. Сильный хотя бы один сигнал — отвечаем.
  refuse_enabled: true
  refuse_vector_below: 0.35     # лучший косинус выживших векторных хитов (0..1)
  refuse_lexical_below: 0.12    # доля термов запроса в лучшем фрагменте (0..1)

watchdog:
  enabled: false
  paths: ["./data/inbox"]
  interval_sec: 30

# ----------------------------------------------------------------------
# LLM. Три режима provider:
#   openai_compatible — ЛЮБАЯ внешняя модель по API с ключом
#                       (OpenAI, OpenRouter, Z.ai, LM Studio и т.п.)
#   ollama            — локальный Ollama (офлайн-режим из ТЗ)
#   none              — без LLM: классификация по правилам rules.yaml,
#                       ответы — экстрактивные (только цитаты из файлов)
# ----------------------------------------------------------------------
llm:
  provider: openai_compatible
  base_url: "https://api.openai.com/v1"   # примеры: https://openrouter.ai/api/v1 , https://api.z.ai/api/paas/v4
  api_key: "${LLM_API_KEY}"
  api_path: "/chat/completions"           # финальный URL = base_url + api_path
  model_main: "gpt-4o-mini"               # классификация/отчёты
  model_light: "gpt-4o-mini"              # вспомогательные задачи
  # v2.8: ретраи при rate-limit (429)/5xx (бесплатный glm-4.5-flash малыми
  # RPM). Ждём Retry-After провайдера, иначе backoff_sec * 2^попытка.
  rate_limit_retries: 2
  rate_limit_backoff_sec: 2.0
  timeout_sec: 60
  temperature: 0.0
  # Доп. поля тела запроса к API (передаются как есть). Для reasoning-моделей
  # Zhipu/Z.ai (glm-4.5*, glm-4.6) рекомендуется отключить «размышления» —
  # ответы быстрее и без <think> вокруг JSON:
  #   extra_body: {"thinking": {"type": "disabled"}}
  extra_body: {}

embeddings:
  # backend (v2.7/v2.9):
  #   auto                 — api, если доступен ключ/base_url (llm.* или
  #                          embeddings.api.*), иначе hashing. Рекомендуется,
  #                          если хотите эмбеддинги ПО КЛЮЧУ.
  #   sentence_transformers — ЛОКАЛЬНАЯ модель, БЕЗ ключа и БЕЗ интернета
  #                          (после первого скачивания). Требует
  #                          pip install -e ".[ml]" (тянет torch, ~2 ГБ).
  #                          Подробный рецепт — README, раздел
  #                          «Локальные эмбеддинги».
  #   hashing              — офлайн без загрузок, но ЭТО НЕ СЕМАНТИКА,
  #                          а лексическое совпадение токенов (последний
  #                          рубеж, когда ничего другого нет);
  #   api                  — НАСТОЯЩИЕ эмбеддинги через OpenAI-совместимый
  #                          /embeddings (base_url/api_key — из embeddings.api
  #                          или наследуются из llm).
  # ВНИМАНИЕ (v2.8, проверено запросами): у МЕЖДУНАРОДНОГО api.z.ai НЕТ
  #    эмбеддингов (в API-docs docs.z.ai только chat/agents/image/video);
  #    запрос /embeddings с моделью embedding-3 даёт 400. Эмбеддинги Zhipu
  #    живут на open.bigmodel.cn (см. гибрид ниже) или ЛОКАЛЬНО:
  #    backend: sentence_transformers (e5-small, без ключа и интернета)
  #    или локальный Ollama: base_url "http://localhost:11434/v1",
  #    model: "bge-m3" (1024 dims, ollama pull bge-m3).
  backend: sentence_transformers
  # --- ЛОКАЛЬНАЯ МОДЕЛЬ (backend: sentence_transformers), v2.9 ---
  # Любой каталог Hugging Face. Дефолт intfloat/multilingual-e5-small:
  # 384 dims, ~120 МБ, на CPU ~6 чанков/с даже на 2 старых ядрах
  # (на офисном ПК в разы быстрее; вопрос в чате — ~20 мс).
  # Тяжелее/качественнее: BAAI/bge-m3 (1024 dims, ~2.3 ГБ, на CPU в
  # 5-8 раз медленнее e5-small).
  # Первый запуск СКАЧИВАЕТ модель с huggingface.co, дальше — офлайн.
  # Медленная сеть: перед запуском задайте переменную окружения
  # HF_ENDPOINT=https://hf-mirror.com (зеркало HF).
  model: "intfloat/multilingual-e5-small"
  batch_size: 32               # чанков за один прогон (и для api, и для локальной)
  # Устройство локальной модели: "" = авто (CUDA, если есть, иначе CPU);
  # "cpu" — принудительно CPU; "cuda" — только при установленном CUDA-torch.
  device: ""
  # Размерность локальной модели: 0 = взять фактическую после загрузки
  # (e5-small = 384, bge-m3 = 1024). Смена = новое векторное пространство =
  # новая коллекция (авто при vector.auto_collection_suffix: true).
  dimensions: 0
  # E5-моделям обязательны префиксы "query: "/"passage: " (без них
  # качество поиска падает). Другим локальным моделям (bge-m3,
  # paraphrase-*) префиксы НЕ нужны — поставьте "".
  query_prefix: "query: "
  passage_prefix: "passage: "
  # v2.7: морфология (Snowball ru) для лексических механизмов — BM25,
  # реранкер, hashing-эмбеддинги, grounding. Без неё «вилоновской» не
  # находил «Вилоновская», а «материалов» — «материал». Для api/
  # sentence_transformers НЕ применяется (модели понимают морфологию сами).
  # После смены флага нужна переиндексация.
  stem_lexical: true
  api:
    model: "embedding-3"       # пример для Z.ai/Zhipu; OpenAI: text-embedding-3-small
    base_url: ""               # пусто = llm.base_url
    api_key: ""                # пусто = llm.api_key
    api_path: "/embeddings"
    timeout_sec: 60
    # Кастомная размерность (v2.7.1). Zhipu embedding-3: 256/512/1024/2048
    # (0 = дефолт провайдера, 2048). OpenAI text-embedding-3-small: 512/1536.
    # 1024 — разумный баланс качества и скорости для русского текста.
    # Смена значения = новое векторное пространство = переиндексация
    # (коллекция подберётся сама при vector.auto_collection_suffix: true).
    dimensions: 0
    # v2.8: ретраи при 429 (rate-limit) от эмбеддинг-API.
    rate_limit_retries: 2
    rate_limit_backoff_sec: 2.0
  # v2.7.1, ГИБРИД (LLM и эмбеддинги у РАЗНЫХ провайдеров): заполните
  # base_url И api_key здесь ПОЛНОСТЬЮ — тогда секция llm на эмбеддинги
  # не влияет. Пример: эмбеддинги через open.bigmodel.cn (ключ Zhipu),
  # а LLM — где угодно:
  #   api:
  #     model: "embedding-3"
  #     base_url: "https://open.bigmodel.cn/api/paas/v4"
  #     api_key: "${EMBEDDING_API_KEY}"  # СВОЯ переменная из .env (ключ
  #                                      # bigmodel.cn НЕ равен ключу z.ai)
  #     dimensions: 1024
  # (если эмбеддинг-провайдер совпадает с LLM — оставьте api_key: ""
  #  здесь и ничего в .env добавлять не нужно)
  # ВАЖНО: при vector.auto_collection_suffix: true (см. ниже) коллекция
  # подбирается автоматически (суффикс backend-модели) — старые векторы не
  # смешиваются с новыми. Если выключите суффикс — меняйте vector.collection
  # вручную и переиндексируйте.

vector:
  # backend: chroma — ChromaDB (рекомендуется); lite — встроенное хранилище (fallback)
  backend: chroma
  collection: "chunks"
  metric: "cosine"
  # v2.7: изоляция векторных пространств. Имя коллекции получает суффикс
  # «-{backend}-{модель}-{hash}»: смена backend/модели эмбеддингов больше
  # НЕ смешивает старые и новые векторы («наложились старые псевдоэмбеддинги
  # на новые»); переиндексация автоматически пишется в новую коллекцию.
  auto_collection_suffix: true

# ----------------------------------------------------------------------
# ГИБРИДНЫЙ РЕТРИВ (v2.7): BM25 + вектор с RRF-слиянием — промышленные
# практики (Elastic/Weaviate/Qdrant, Anthropic Contextual Retrieval).
# ----------------------------------------------------------------------
retrieval:
  # Верхняя граница чанков для BM25 (защита от OOM). Раньше был молчаливый
  # LIMIT 4000 БЕЗ сортировки — чанки поздних файлов выпадали из поиска.
  max_chunks: 200000
  # Доля от лучшего векторного score, ниже которой хиты отсеиваются ДО
  # слияния: убирает «мусор с похожестью 0.11» из промпта LLM.
  vector_relative_cutoff: 0.55
  # Буст RRF-score чанков файлов, чьё ИМЯ совпадает с термами запроса
  # («вилоновская» -> все сметы Вилоновской выше прочих). Общий сигнал,
  # без привязок к фразам.
  filename_boost: 0.35
  bm25_weight: 1.0            # вес BM25-источника при RRF-слиянии
  vector_weight: 1.0          # вес векторного источника при RRF-слиянии
  # Фрагменты с нулевым лексическим перекрытием выбрасываются, если есть
  # хоть один с перекрытием (именно нулевой хвост провоцировал галлюцинации).
  rerank_drop_zero_overlap: true

reranker:
  # backend: simple — лексический (офлайн); cross_encoder — модель из поля model
  backend: simple
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

chunking:
  size_tokens: 512
  overlap_tokens: 64
  # v2.6.1: преамбула «[имя_файла] » в каждом чанке. Без неё строки смет
  # из xlsx не содержат имени объекта («Вилоновская») — поиск по содержимому
  # их не находит. Требует переобработки файлов (админ-панель ->
  # «Полная переиндексация»).
  filename_prefix: true
  # v2.7: табличные форматы чанкуются ПО СТРОКАМ — чанк никогда не режет
  # строку сметы посередине (раньше «Унифлекс ЭПП… рул» обрывался, материал
  # терялся). В преамбуле каждого чанка — имя файла и лист, шапка колонок
  # повторяется в каждом чанке (contextual retrieval, Anthropic 2024).
  table_aware: true
  # Повторять шапку таблицы первой строкой каждого чанка
  table_header_in_chunk: true
  # Форматы, обрабатываемые табличным чанкингом (по листам/строкам)
  table_formats: [xlsx, xlsm, csv]
  # --- v2.8: КОНТЕКСТУАЛЬНЫЕ ПРЕАМБУЛЫ (Contextual Retrieval, Anthropic
  # 2024; промышленно +18 п.п. recall@5 на вопросах-синтезах) ---
  # В начало каждого чанка перед эмбеддингом и индексацией добавляется:
  # [имя файла | Лист: X | Раздел: Y > Z | однострочная заметка о документе].
  # Однострочная заметка: 1 LLM-вызов на файл (model_light), кэшируется
  # в описании файла; сбой/офлайн — fallback из метаданных классификатора.
  # Путь заголовков строится по дереву документа без LLM.
  # После включения/смены настроек нужна переиндексация.
  context_note: true
  note_max_chars: 160
  headings_in_prefix: true

ocr:
  # engine: tesseract | paddle | none
  engine: tesseract
  tesseract_cmd: ""              # пусто = искать в PATH; пример Windows: "C:/Program Files/Tesseract-OCR/tesseract.exe"
  tesseract_langs: ["rus", "eng"]
  min_confidence: 0.80
  reject_threshold: 0.50
  process_embedded_images: false

groundrails:
  enabled: true
  cut_ratio: 0.30
  # v2.6.1: confidence = среднее TOP-K score фрагментов (минимум давал «0»
  # при одном слабом фрагменте в выдаче)
  confidence_top_k: 3
  # v2.7: калиброванная уверенность =
  #   w_retrieval * среднее TOP-K score ретрива
  # + w_grounding * доля переживших grounding-валидацию утверждений.
  # Голый retrieval-score не откалиброван (0.11 у мусора), смесь даёт
  # осмысленную шкалу 0..1.
  confidence_retrieval_weight: 0.6
  confidence_grounding_weight: 0.4

a2a:
  enabled: true
  agent_name: "document-agent"
  # Разрешить внешним A2A-клиентам вызывать /a2a без JWT (DD-8)
  auth_required: false

limits:
  max_file_mb: 500
  max_query_len: 2000

auth:
  token_expire_minutes: 1440
  # --- ДОСТУП К API ИЗ ВНЕШНИХ СИСТЕМ ПО КЛЮЧУ (без логина) ---
  # Ключ передаётся в заголовке "X-API-Key: <ключ>" или "Authorization: Bearer <ключ>".
  # Значение берётся из .env (EXTERNAL_API_KEY=...). Можно задать несколько
  # ключей с разными ролями. Пустой key = запись отключена. role: user | admin
  api_keys:
    - key: "${EXTERNAL_API_KEY}"
      name: "external-system"
      role: "user"
    # - key: "${EXTERNAL_API_KEY_ADMIN}"
    #   name: "external-admin"
    #   role: "admin"
