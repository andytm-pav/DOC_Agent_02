# ======================================================================
# ЕДИНЫЙ КОНФИГ агента «Документовед».
# Всё, что настраивается, — здесь. Код значения не хардкодит.
# Поддерживается подстановка переменных окружения: "${VAR}" (из .env).
# ======================================================================

app:
  host: 0.0.0.0
  port: 8000
  secret_key: "${SECRET_KEY}"
  data_dir: "./data"
  # Администратор по умолчанию (создаётся при первом старте БД)
  admin_username: "${ADMIN_USERNAME}"
  admin_password: "${ADMIN_PASSWORD}"
  # Куда класть загруженные файлы (подпапка внутри data_dir)
  storage_subdir: "storage"

storage:
  local_paths: ["./data/storage"]
  network_paths: []            # пример: ["smb://user:pass@server/share"]

# ----------------------------------------------------------------------
# ИМПОРТ СВАЛКИ ФАЙЛОВ ИЗ ПАПКИ:
#   - в чате есть кнопка «Импортировать папку» — путь можно указать там;
#   - пути, заданные здесь, автоматически подставляются в поле UI.
#   Плюс по-прежнему можно перетаскивать файлы по одному (drag&drop).
# ----------------------------------------------------------------------
ingest:
  folder_paths: []             # пример: ["D:/Свалка_документов", "C:/Docs/входящие"]
  recursive: true              # обходить вложенные подпапки
  max_files_per_scan: 1000     # максимум документов за один импорт (защита)
  # Что импортировать из папки (по расширению). Остальное пропускается
  # со счётчиком «не поддерживаются». Расширение — без точки.
  supported_extensions: [pdf, docx, xlsx, xlsm, pptx, csv, txt, log, md,
                         eml, msg, xml, gge, amkr, arps, zip,
                         png, jpg, jpeg, gif, bmp, tif, tiff, 7z, rar]

# ----------------------------------------------------------------------
# РАЗГРЕБАНИЕ СВАЛКИ ПО ПАПКАМ:
#   агент сам создаёт папку по указанному пути и раскладывает файлы из
#   свалки по тематическим подпапкам — названия придумывает по содержимому
#   (LLM из секции llm; без LLM — fallback: by_extension | single).
#   По умолчанию файлы КОПИРУЮТСЯ, свалка не меняется.
# ----------------------------------------------------------------------
sorting:
  enabled: true
  default_output_suffix: "_разобрано"      # если «куда» не указано: <свалка><суффикс>
  run_dir_prefix: "Разобранная свалка"     # имя создаваемой папки + дата-время
  run_dir_time_format: "%Y-%m-%d_%H-%M-%S"
  recursive: true                          # обходить вложенные подпапки свалки
  max_files: 500                           # максимум файлов за один запуск (защита)
  text_excerpt_chars: 1200                 # сколько символов текста читать из файла для темы
  batch_size: 20                           # файлов в одном запросе к LLM
  batch_max_chars: 12000                   # макс. объём символов в одном запросе к LLM
  max_folders: 20                          # максимум тематических папок (лишнее -> Прочее)
  max_folder_name_len: 60                  # макс. длина названия папки
  misc_folder: "Прочее"                    # куда попадает неопознанное/сверх лимита
  fallback: "by_extension"                 # без LLM: by_extension | single (всё в misc_folder)
  fallback_folder_template: "Файлы {ext}"  # имя папки при by_extension (ext = PDF, DOCX...)
  move_files: false                        # false = копировать; true = перемещать (свалка очистится)
  duplicate_name_template: "{stem} ({n}){suffix}"  # коллизии имён в одной папке
  llm_retries: 1                           # повторов на пакет при сбое LLM
  poll_interval_ms: 1000                   # как часто UI опрашивает статус разбора

watchdog:
  enabled: false
  paths: ["./data/inbox"]
  interval_sec: 30

# ----------------------------------------------------------------------
# LLM. Три режима provider:
#   openai_compatible — ЛЮБАЯ внешняя модель по API с ключом
#                       (OpenAI, OpenRouter, Z.ai, LM Studio и т.п.)
#   ollama            — локальный Ollama (офлайн-режим из ТЗ)
#   none              — без LLM: классификация по правилам rules.yaml,
#                       ответы — экстрактивные (только цитаты из файлов)
# ----------------------------------------------------------------------
llm:
  
  provider: openai_compatible
  base_url: "https://api.z.ai/api/paas/v4"   # Z.ai. Если ключ от bigmodel.cn: https://open.bigmodel.cn/api/paas/v4
  api_key: "${LLM_API_KEY}"
  api_path: "/chat/completions"
  model_main: "glm-4.5-flash"
  model_light: "glm-4.5-flash"
  timeout_sec: 60
  temperature: 0.0

  #provider: openai_compatible
  #base_url: "https://api.openai.com/v1"   # примеры: https://openrouter.ai/api/v1 , https://api.z.ai/api/paas/v4
  #api_key: "${LLM_API_KEY}"
  #api_path: "/chat/completions"           # финальный URL = base_url + api_path
  #model_main: "gpt-4o-mini"               # классификация/отчёты
  #model_light: "gpt-4o-mini"              # вспомогательные задачи
  #timeout_sec: 60
  #temperature: 0.0

embeddings:
  # backend: hashing — офлайн, без загрузки моделей (детерминированный);
  #          sentence_transformers — модель из поля model (нужен extras [ml])
  backend: hashing
  model: "intfloat/multilingual-e5-small"
  batch_size: 32

vector:
  # backend: chroma — ChromaDB (рекомендуется); lite — встроенное хранилище (fallback)
  backend: chroma
  collection: "chunks"
  metric: "cosine"

reranker:
  # backend: simple — лексический (офлайн); cross_encoder — модель из поля model
  backend: simple
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

chunking:
  size_tokens: 512
  overlap_tokens: 64

ocr:
  # engine: tesseract | paddle | none
  engine: tesseract
  tesseract_cmd: ""              # пусто = искать в PATH; пример Windows: "C:/Program Files/Tesseract-OCR/tesseract.exe"
  tesseract_langs: ["rus", "eng"]
  min_confidence: 0.80
  reject_threshold: 0.50
  process_embedded_images: false

groundrails:
  enabled: true
  cut_ratio: 0.30

a2a:
  enabled: true
  agent_name: "document-agent"
  # Разрешить внешним A2A-клиентам вызывать /a2a без JWT (DD-8)
  auth_required: false

limits:
  max_file_mb: 500
  max_query_len: 2000

auth:
  token_expire_minutes: 1440
  # --- ДОСТУП К API ИЗ ВНЕШНИХ СИСТЕМ ПО КЛЮЧУ (без логина) ---
  # Ключ передаётся в заголовке "X-API-Key: <ключ>" или "Authorization: Bearer <ключ>".
  # Значение берётся из .env (EXTERNAL_API_KEY=...). Можно задать несколько
  # ключей с разными ролями. Пустой key = запись отключена. role: user | admin
  api_keys:
    - key: "${EXTERNAL_API_KEY}"
      name: "external-system"
      role: "user"
    # - key: "${EXTERNAL_API_KEY_ADMIN}"
    #   name: "external-admin"
    #   role: "admin"
