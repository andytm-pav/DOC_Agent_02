{% extends "base.html" %}
{% block content %}
<div class="login-card">
    <h2>Вход в «Документовед»</h2>
    <form id="loginForm" autocomplete="off">
        <label>Логин<input id="loginUser" required></label>
        <label>Пароль<input id="loginPass" type="password" required></label>
        <button class="btn btn-primary" type="submit">Войти</button>
        <p id="loginError" class="error" hidden>Неверный логин или пароль</p>
    </form>
</div>
{% endblock %}
